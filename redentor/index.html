<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Redentor — Portal temvia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#2d3748; --accent:#f59e0b; --accent2:#3b82f6; --green:#10b981; --red:#ef4444; --text:#e6edf3; --muted:#8b949e; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .topbar{background:linear-gradient(180deg,#11161d,#0d1117);border-bottom:1px solid var(--border);padding:calc(20px + env(safe-area-inset-top)) 18px 16px;text-align:center}
  .brand-sub{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:0.6px;font-weight:500}
  .wrap{flex:1;width:100%;max-width:560px;margin:0 auto;padding:22px 16px 40px}
  .title{font-family:'Barlow',sans-serif;font-weight:700;font-size:18px;margin-bottom:4px}
  .subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}
  .card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,transform .05s,background .15s;color:var(--text);position:relative}
  .card:active{transform:scale(0.99)} .card:hover{border-color:var(--accent);background:var(--surface2)}
  .card.desativado{opacity:0.45;cursor:default}
  .card-ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--accent)}
  .card-logo{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Barlow',sans-serif;font-weight:800;font-size:20px;color:#000;flex-shrink:0}
  .card-info{flex:1;min-width:0}
  .card-nome{font-family:'Barlow',sans-serif;font-weight:700;font-size:16px}
  .card-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .card-seta{color:var(--muted);font-size:20px;flex-shrink:0}
  .badge{position:absolute;top:10px;right:12px;background:var(--green);color:#04210f;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
  .continuar{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:22px}
  .continuar-label{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-weight:600}
  .btn-primario{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),#d97706);color:#000;border:none;border-radius:10px;padding:14px 16px;font-family:'Barlow',sans-serif;font-weight:800;font-size:15px;width:100%;cursor:pointer;text-decoration:none;justify-content:center}
  .btn-primario:disabled{opacity:0.6;cursor:wait}
  .btn-voltar{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;margin-bottom:18px;font-family:'Inter',sans-serif}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .grupo{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin:14px 0 8px}
  .campo{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:16px;font-family:'Inter',sans-serif;margin-bottom:10px}
  .campo:focus{outline:none;border-color:var(--accent)}
  .campo-senha{position:relative}
  .campo-senha .campo{padding-right:46px}
  .olho{position:absolute;right:10px;top:12px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:4px}
  .msg{min-height:20px;font-size:13px;margin:6px 0 10px}
  .msg.erro{color:var(--red)} .msg.ok{color:var(--green)} .msg.info{color:var(--muted)}
  .foot{text-align:center;font-size:11px;color:var(--muted);padding:18px}
</style>
</head>

<script>
  // ===== CATALOGO: TRANSPORTADORAS -> OPERACOES =====

  const PERFIS = [

    { id: 'passageiro', nome: 'Passageiro',      desc: 'Confirmar presença e acompanhar a van', ico: IC.user },
    { id: 'cliente',    nome: 'Empresa cliente', desc: 'Solicitações e acompanhamento',         ico: IC.building }
  ];

  const K_PERFIL='temvia_ultimo_perfil', K_OPER='temvia_ultima_operacao';
  const get=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
  const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const opers=()=>{const o=[];TRANSPORTADORAS.forEach(t=>t.operacoes.forEach(op=>o.push({...op,transp:t.nome,transpId:t.id,key:t.id+':'+op.id})));return o;};
  const soDigitos=t=>(t||'').replace(/\D/g,'');
  // Comparacao de telefone IGUAL a usada pelos apps (motorista/passageiro):
  // exige numero com pelo menos 8 digitos e compara os 8 ultimos.
  // Sem isso, um cadastro com telefone em branco ou curto casa com QUALQUER busca
  // e o portal oferece uma empresa onde a pessoa nao existe.
  // Mesma regra dos apps: ferias e afastado entram; desligado e sem-rota nao.
  const STATUS_PODE_ENTRAR=['ativo','ferias','afastado'];
  // Mostrar/ocultar senha (o campo fica escondido por padrao).
  function verSenha(idCampo,idBotao){
    const c=document.getElementById(idCampo), b=document.getElementById(idBotao);
    if(!c) return;
    const ver = c.type==='password';
    c.type = ver ? 'text' : 'password';
    if(b){ b.textContent = ver ? '\uD83D\uDE48' : '\uD83D\uDC41\uFE0F'; b.title = ver ? 'Ocultar senha' : 'Mostrar senha'; }
  }
  const telBate=(bruto,alvo)=>{const d=soDigitos(bruto); return d.length>=8 && (d===alvo || d.slice(-8)===alvo.slice(-8));};
  const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- Firebase helpers (uma instancia por operacao) ----
  const _apps={};
  async function fbDe(op){
    if(_apps[op.key]) return _apps[op.key];
    const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const nome='portal-'+op.key.replace(':','-');
    const app = getApps().find(a=>a.name===nome) || initializeApp(op.fb, nome);
    _apps[op.key]=app; return app;
  }
  async function docDe(op, docId){
    const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app = await fbDe(op);
    const snap = await getDoc(doc(getFirestore(app), op.clienteId, docId));
    return snap.exists() ? snap.data() : null;
  }

  let perfilAtual=null;
  const T=()=>document.getElementById('tela');
  const sub=t=>{};

  // ================= TELA 1: PERFIS =================
  function renderPerfil(){
    sub('Portal de Acesso'); perfilAtual=null;
    let h='';
    const pId=get(K_PERFIL), oKey=get(K_OPER);
    const p=PERFIS.find(x=>x.id===pId), o=opers().find(x=>x.key===oKey);
    if(p&&o&&(p.id==='motorista'||p.id==='gestor')){
      const dest=o.path+(p.id==='motorista'?'motorista.html':'index.html');
      h+='<div class="continuar"><div class="continuar-label">Continuar de onde parou</div>'+

         '<div class="divider">ou escolher outro acesso</div>';
    }
    h+='<div class="title">Quem é você?</div><div class="subtitle">Escolha o seu tipo de acesso.</div>';
    PERFIS.forEach(pf=>{
      h+='<div class="card" onclick="escolher(\''+pf.id+'\')">'+
         '<div class="card-ico">'+pf.ico+'</div>'+
         '<div class="card-info"><div class="card-nome">'+pf.nome+'</div><div class="card-desc">'+pf.desc+'</div></div>'+
         '<div class="card-seta">\u203A</div></div>';
    });
    T().innerHTML=h;
  }
  function escolher(id){
    perfilAtual=PERFIS.find(x=>x.id===id);
    set(K_PERFIL,id);
    if(id==='motorista') renderMotorista();
    else if(id==='gestor') renderGestorLogin();
    else if(id==='passageiro') renderPassageiro();
    else renderCliente();
  }
  const voltar='<button class="btn-voltar" onclick="renderPerfil()">\u2039 Trocar tipo de acesso</button>';

  // ================= MOTORISTA: escolhe a operacao =================
  function renderOperacoes(arquivo){
    sub(perfilAtual.nome);
    const multi=TRANSPORTADORAS.length>1, ultima=get(K_OPER);
    let h=voltar+'<div class="title">Escolha a empresa</div><div class="subtitle">Acesso de '+perfilAtual.nome+'</div>';
    TRANSPORTADORAS.forEach(t=>{
      if(multi) h+='<div class="grupo">'+t.nome+'</div>';
      t.operacoes.forEach(op=>{
        const key=t.id+':'+op.id;
        h+='<div class="card" onclick="set(K_OPER,\''+key+'\');window.location.href=\''+op.path+arquivo+'\'">'+
           (key===ultima?'<span class="badge">ULTIMA</span>':'')+
           '<div class="card-logo" style="background:'+op.cor+'">'+op.inicial+'</div>'+
           '<div class="card-info"><div class="card-nome">'+op.nome+'</div><div class="card-desc">'+op.desc+'</div></div>'+
           '<div class="card-seta">\u203A</div></div>';
      });
    });
    T().innerHTML=h;
  }

  // ================= MOTORISTA: telefone -> so as operacoes onde ele trabalha =================
  function renderMotorista(){
    sub('Motorista');
    const telLembrado=get('temvia_moto_tel');
    T().innerHTML=voltar+
      '<div class="title">Acesso do Motorista</div>'+
      '<div class="subtitle">Digite seu telefone. Mostramos apenas as empresas onde você trabalha.</div>'+
      '<input class="campo" id="mTel" type="tel" inputmode="numeric" placeholder="(15) 99999-9999" value="'+esc(telLembrado)+'">'+
      '<div class="msg" id="mMsg"></div>'+
      '<button class="btn-primario" id="mBtn" onclick="motoristaEntrar()">Continuar</button>'+
      '<div class="divider">não encontrou seu telefone?</div>'+
      '<button class="btn-voltar" style="width:100%;margin-bottom:0" onclick="renderOperacoes(\'motorista.html\')">Escolher a empresa manualmente</button>';
    if(telLembrado) setTimeout(motoristaEntrar, 50);
  }
  async function motoristaEntrar(){
    const tel=soDigitos(document.getElementById('mTel').value);
    const msg=document.getElementById('mMsg'), btn=document.getElementById('mBtn');
    msg.className='msg'; msg.textContent='';
    if(tel.length<8){ msg.className='msg erro'; msg.textContent='Digite o telefone com DDD.'; return; }
    btn.disabled=true; btn.textContent='Procurando...';
    const achadas=[];
    for(const op of opers()){
      try{
        const dados=await docDe(op,'dados');
        if(!dados) continue;
        const m=(dados.MOTORISTAS||[]).find(x=>telBate(x.tel,tel));
        if(m) achadas.push({op, nome:m.nome});
      }catch(e){}
    }
    btn.disabled=false; btn.textContent='Continuar';
    if(!achadas.length){ msg.className='msg erro'; msg.textContent='Telefone não encontrado no cadastro de motoristas. Fale com o gestor ou use a escolha manual abaixo.'; return; }
    set('temvia_moto_tel', tel);
    if(achadas.length===1){ motoristaIr(achadas[0]); return; }
    let h=voltar+'<div class="title">Olá, '+esc((achadas[0].nome||'').split(' ')[0])+'</div><div class="subtitle">Escolha a empresa que vai rodar agora.</div>';
    const multi=[...new Set(achadas.map(a=>a.op.transp))].length>1;
    let transpAtual='';
    achadas.forEach((a,i)=>{
      if(multi && a.op.transp!==transpAtual){ transpAtual=a.op.transp; h+='<div class="grupo">'+a.op.transp+'</div>'; }
      h+='<div class="card" onclick="motoristaIr(window._mAchadas['+i+'])">'+
         (a.op.key===get(K_OPER)?'<span class="badge">ULTIMA</span>':'')+
         '<div class="card-logo" style="background:'+a.op.cor+'">'+a.op.inicial+'</div>'+
         '<div class="card-info"><div class="card-nome">'+a.op.nome+'</div><div class="card-desc">'+a.op.desc+'</div></div>'+
         '<div class="card-seta">\u203A</div></div>';
    });
    window._mAchadas=achadas; T().innerHTML=h;
  }
  function motoristaIr(a){
    set(K_OPER, a.op.key);
    window.location.href=a.op.path+'motorista.html';
  }

  // ================= GESTOR: login unico -> escolhe a operacao =================
  function renderGestorLogin(){
    sub('Gestor');
    T().innerHTML=voltar+
      '<div class="title">Entrar como Gestor</div>'+
      '<div class="subtitle">Um único login. Depois você escolhe qual empresa vai gerenciar.</div>'+
      '<input class="campo" id="gEmail" type="email" autocomplete="username" placeholder="seu@email.com">'+
      '<div class="campo-senha"><input class="campo" id="gSenha" type="password" autocomplete="current-password" placeholder="Senha">'+
      '<button type="button" class="olho" id="gOlho" onclick="verSenha(\'gSenha\',\'gOlho\')" title="Mostrar senha">\uD83D\uDC41\uFE0F</button></div>'+
      '<div class="msg" id="gMsg"></div>'+
      '<button class="btn-primario" id="gBtn" onclick="gestorEntrar()">Entrar</button>'+
      '<div style="text-align:center;margin-top:12px"><a href="#" onclick="gestorEsqueci();return false;" style="color:#8b949e;font-size:13px">Esqueci minha senha</a></div>';
  }
  async function gestorEntrar(){
    const email=document.getElementById('gEmail').value.trim();
    const senha=document.getElementById('gSenha').value;
    const msg=document.getElementById('gMsg'), btn=document.getElementById('gBtn');
    msg.className='msg'; msg.textContent='';
    if(!email||!senha){ msg.className='msg erro'; msg.textContent='Preencha e-mail e senha.'; return; }
    btn.disabled=true; btn.textContent='Entrando...';
    const { getAuth, signInWithEmailAndPassword, signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    const resultados=[]; let ehCliente=false;
    for(const op of opers()){
      try{
        const auth=getAuth(await fbDe(op));
        await signInWithEmailAndPassword(auth, email, senha);
        // Conta da empresa cliente NAO gerencia: derruba a sessao e marca o card.
        const ac=await docDe(op,'acessos');
        const u=((ac&&ac.lista)||[]).find(x=>(x.email||'').trim().toLowerCase()===email.toLowerCase());
        if(u && u.papel==='cliente'){
          ehCliente=true;
          try{ await signOut(auth); }catch(e){}
          resultados.push({op, ok:false, cliente:true});
        } else {
          resultados.push({op, ok:true});
        }
      }catch(e){ resultados.push({op, ok:false}); }
    }
    btn.disabled=false; btn.textContent='Entrar';
    const oks=resultados.filter(r=>r.ok);
    if(!oks.length){
      msg.className='msg erro';
      msg.textContent = ehCliente
        ? 'Esta conta e do portal da empresa cliente. Volte e escolha o perfil "Empresa cliente".'
        : 'E-mail ou senha incorretos (ou sem acesso).';
      return;
    }
    renderGestorOperacoes(resultados);
  }
  async function gestorEsqueci(){
    const email=(document.getElementById('gEmail').value||'').trim();
    const msg=document.getElementById('gMsg');
    if(!email){ msg.className='msg erro'; msg.textContent='Digite seu e-mail acima e clique de novo.'; return; }
    const { getAuth, sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    let enviou=false;
    for(const op of opers()){
      try{ await sendPasswordResetEmail(getAuth(await fbDe(op)), email); enviou=true; }catch(e){}
    }
    msg.className=enviou?'msg':'msg erro';
    msg.textContent=enviou?'Enviamos um link para voce criar uma senha nova. Confira tambem o spam.':'Nao foi possivel enviar. Confira o e-mail digitado.';
  }
  function renderGestorOperacoes(resultados){
    sub('Gestor');
    const multi=TRANSPORTADORAS.length>1, ultima=get(K_OPER);
    let h=voltar+'<div class="title">Qual empresa vai gerenciar?</div><div class="subtitle">Login confirmado — sessão liberada nas empresas abaixo.</div>';
    let transpAtual='';
    resultados.forEach(r=>{
      const op=r.op;
      if(multi && op.transp!==transpAtual){ transpAtual=op.transp; h+='<div class="grupo">'+op.transp+'</div>'; }
      if(r.ok){
        h+='<div class="card" onclick="set(K_OPER,\''+op.key+'\');window.location.href=\''+op.path+'index.html\'">'+
           (op.key===ultima?'<span class="badge">ULTIMA</span>':'')+
           '<div class="card-logo" style="background:'+op.cor+'">'+op.inicial+'</div>'+
           '<div class="card-info"><div class="card-nome">'+op.nome+'</div><div class="card-desc">'+op.desc+'</div></div>'+
           '<div class="card-seta">\u203A</div></div>';
      } else {
        h+='<div class="card desativado">'+
           '<div class="card-logo" style="background:'+op.cor+'">'+op.inicial+'</div>'+
           '<div class="card-info"><div class="card-nome">'+op.nome+'</div><div class="card-desc">'+(r.cliente?'Conta de empresa cliente':'Sem acesso com este login')+'</div></div></div>';
      }
    });
    T().innerHTML=h;
  }

  // ================= PASSAGEIRO: telefone -> acha a empresa e a linha =================
  function renderPassageiro(){
    sub('Passageiro');
    T().innerHTML=voltar+
      '<div class="title">Acesso do Passageiro</div>'+
      '<div class="subtitle">Digite seu telefone. O sistema encontra sua empresa e sua linha sozinho.</div>'+
      '<input class="campo" id="pTel" type="tel" inputmode="numeric" placeholder="(15) 99999-9999">'+
      '<div class="msg" id="pMsg"></div>'+
      '<button class="btn-primario" id="pBtn" onclick="passageiroEntrar()">Entrar</button>';
  }
  async function passageiroEntrar(){
    const tel=soDigitos(document.getElementById('pTel').value);
    const msg=document.getElementById('pMsg'), btn=document.getElementById('pBtn');
    msg.className='msg'; msg.textContent='';
    if(tel.length<8){ msg.className='msg erro'; msg.textContent='Digite o telefone com DDD.'; return; }
    btn.disabled=true; btn.textContent='Procurando...';
    const achados=[];
    for(const op of opers()){
      try{
        const dados=await docDe(op,'dados');
        if(!dados) continue;
        const todos=[];
        (dados.DATA||[]).forEach(r=>(r.passageiros||[]).forEach(p=>{ if(STATUS_PODE_ENTRAR.includes(p.status)) todos.push(p); }));
        (dados.SEM_ROTA||[]).forEach(p=>todos.push(p));
        const m=todos.find(p=>telBate(p.telefone,tel));
        if(m) achados.push({op, tel: soDigitos(m.telefone)});
      }catch(e){}
    }
    btn.disabled=false; btn.textContent='Entrar';
    if(!achados.length){ msg.className='msg erro'; msg.textContent='Telefone não encontrado. Confira o número ou fale com o gestor.'; return; }
    if(achados.length===1){ passageiroIr(achados[0]); return; }
    // telefone em mais de uma operacao: escolher
    let h=voltar+'<div class="title">Encontramos você em mais de uma empresa</div><div class="subtitle">Escolha em qual quer entrar.</div>';
    achados.forEach((a,i)=>{
      h+='<div class="card" onclick="passageiroIr(window._pAchados['+i+'])">'+
         '<div class="card-logo" style="background:'+a.op.cor+'">'+a.op.inicial+'</div>'+
         '<div class="card-info"><div class="card-nome">'+a.op.nome+'</div><div class="card-desc">'+a.op.desc+'</div></div>'+
         '<div class="card-seta">\u203A</div></div>';
    });
    window._pAchados=achados; T().innerHTML=h;
  }
  function passageiroIr(a){
    try{ localStorage.setItem(a.op.passKey, a.tel); }catch(e){}
    set(K_OPER, a.op.key);
    window.location.href=a.op.path+'passageiro.html';
  }

  // ================= EMPRESA CLIENTE: senha -> acha a empresa =================
  function renderCliente(){
    sub('Empresa cliente');
    T().innerHTML=voltar+
      '<div class="title">Acesso da Empresa Cliente</div>'+
      '<div class="subtitle">Entre com seu e-mail e senha. Se sua empresa ainda usa a senha unica, deixe o e-mail em branco.</div>'+
      '<input class="campo" id="cEmail" type="email" autocomplete="username" placeholder="seu@email.com (opcional)">'+
      '<div class="campo-senha"><input class="campo" id="cSenha" type="password" autocomplete="current-password" placeholder="Senha">'+
      '<button type="button" class="olho" id="cOlho" onclick="verSenha(\'cSenha\',\'cOlho\')" title="Mostrar senha">\uD83D\uDC41\uFE0F</button></div>'+
      '<div class="msg" id="cMsg"></div>'+
      '<button class="btn-primario" id="cBtn" onclick="clienteEntrar()">Entrar</button>'+
      '<div style="text-align:center;margin-top:12px"><a href="#" onclick="clienteEsqueci();return false;" style="color:#8b949e;font-size:13px">Esqueci minha senha</a></div>';
  }
  // Com e-mail: conta individual (Firebase Auth) + conferencia na lista de acessos.
  // Sem e-mail: senha unica antiga da empresa (transicao).
  async function clienteEntrar(){
    const email=(document.getElementById('cEmail').value||'').trim();
    const val=document.getElementById('cSenha').value;
    const msg=document.getElementById('cMsg'), btn=document.getElementById('cBtn');
    msg.className='msg'; msg.textContent='';
    if(!val){ msg.className='msg erro'; msg.textContent='Digite a senha.'; return; }
    btn.disabled=true; btn.textContent='Verificando...';
    let alvo=null;
    if(email){
      const { getAuth, signInWithEmailAndPassword, signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
      let entrou=false, motivo='';
      for(const op of opers()){
        try{
          const auth=getAuth(await fbDe(op));
          await signInWithEmailAndPassword(auth, email, val);
          entrou=true; // e-mail e senha conferem neste projeto
          const ac=await docDe(op,'acessos');
          const u=((ac&&ac.lista)||[]).find(x=>(x.email||'').trim().toLowerCase()===email.toLowerCase());
          if(u && u.papel==='cliente' && u.ativo!==false){ alvo=op; break; }
          motivo = !u ? 'naolistado' : (u.papel!=='cliente' ? 'papel' : 'inativo');
          await signOut(auth);
        }catch(e){}
      }
      btn.disabled=false; btn.textContent='Entrar';
      if(!alvo){
        msg.className='msg erro';
        if(!entrou) msg.textContent='E-mail ou senha incorretos.';
        else if(motivo==='papel') msg.textContent='Login correto, mas o perfil cadastrado nao e de empresa cliente. Peca ao gestor para conferir o campo papel.';
        else if(motivo==='inativo') msg.textContent='Login correto, mas este acesso esta desativado. Fale com o gestor.';
        else msg.textContent='Login correto, mas voce ainda nao esta na lista de acessos desta empresa. Fale com o gestor.';
        return;
      }
    } else {
      for(const op of opers()){
        let senhaOp=op.senhaClienteFallback;
        try{
          const cfg=await docDe(op,'config');
          if(cfg && cfg.senhaCliente) senhaOp=cfg.senhaCliente;
        }catch(e){}
        if(val===senhaOp){ alvo=op; break; }
      }
      btn.disabled=false; btn.textContent='Entrar';
      if(!alvo){ msg.className='msg erro'; msg.textContent='Senha incorreta.'; return; }
      try{ localStorage.setItem('temvia_cliente_senha_'+alvo.clienteId, val); }catch(e){}
    }
    set(K_OPER, alvo.key);
    window.location.href=alvo.path+'cliente.html';
  }
  async function clienteEsqueci(){
    const email=(document.getElementById('cEmail').value||'').trim();
    const msg=document.getElementById('cMsg');
    if(!email){ msg.className='msg erro'; msg.textContent='Digite seu e-mail acima e clique de novo.'; return; }
    const { getAuth, sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    let enviou=false;
    for(const op of opers()){
      try{ await sendPasswordResetEmail(getAuth(await fbDe(op)), email); enviou=true; }catch(e){}
    }
    msg.className=enviou?'msg':'msg erro';
    msg.textContent=enviou?'Enviamos um link para voce criar uma senha nova. Confira tambem o spam.':'Nao foi possivel enviar. Confira o e-mail digitado.';
  }

  renderPerfil();
</script>
