<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>temvia — Acesso</title>
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png">
<style>
  :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
        --text:#e6edf3;--muted:#8b949e;--accent:#FBAE17;--erro:#f85149}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
       font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
       display:flex;flex-direction:column;align-items:center;
       padding:0 20px 40px}
  .topo{width:100%;text-align:center;padding:38px 0 30px;border-bottom:1px solid var(--border);
        margin-bottom:40px}
  .logo{display:flex;align-items:center;justify-content:center;gap:11px;
        font-family:'Barlow',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.5px}
  .logo img{height:30px;width:auto}
  .sub{font-size:11px;color:var(--muted);letter-spacing:.16em;margin-top:7px;text-transform:uppercase}
  .caixa{width:100%;max-width:420px}
  h1{font-family:'Barlow',sans-serif;font-size:22px;margin:0 0 6px}
  .ajuda{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px}
  label{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;
        text-transform:uppercase;margin-bottom:7px}
  input{width:100%;background:var(--surface);border:1px solid var(--border);
        border-radius:11px;padding:14px 15px;color:var(--text);font-size:16px;
        font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:14px;background:var(--accent);border:none;
         border-radius:11px;padding:15px;color:#14161a;font-weight:700;font-size:15px;
         font-family:inherit;cursor:pointer}
  button[disabled]{opacity:.55;cursor:default}
  .erro{margin-top:15px;padding:13px 15px;background:rgba(248,81,73,0.1);
        border:1px solid rgba(248,81,73,0.35);border-radius:10px;
        font-size:13px;line-height:1.6;color:#ffb4ae;display:none}
  .rodape{margin-top:34px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  .spin{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);
        border-radius:50%;animation:g .8s linear infinite;margin:0 auto}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topo">
  <div class="logo"><img src="/marca/temvia-simbolo.png" alt="">temvia</div>
  <div class="sub">Gestão inteligente para transporte fretado</div>
</div>

<div class="caixa">
  <h1>Acessar</h1>
  <p class="ajuda">Informe o e-mail ou o telefone que você usa no sistema.
     Levamos você direto ao portal da sua empresa.</p>

  <label for="ident">E-mail ou telefone</label>
  <input id="ident" type="text" autocomplete="username"
         placeholder="seu@email.com ou (15) 99999-9999" autofocus>
  <button id="btn" onclick="entrar()">Continuar</button>

  <div class="erro" id="erro"></div>
  <div style="margin-top:20px;display:none" id="carregando"><div class="spin"></div></div>

  <div class="rodape">
    Primeiro acesso ou não reconhece seu contato?<br>
    Fale com o responsável pelo transporte na sua empresa.
  </div>
</div>

<script>
// ============================================================
// PORTA DE ENTRADA — app.temvia.com.br
//
// POR QUE ESTA TELA NÃO FAZ LOGIN
// Cada transportadora tem projeto Firebase próprio — é isso que impede
// uma ver os dados da outra. Autenticar aqui exigiria saber de antemão
// em qual projeto validar, e tentar todos seria disparar login falhado
// em sistema alheio.
//
// Então aqui só se descobre PARA ONDE ir. O login acontece no portal da
// transportadora, onde a sessão vale.
//
// POR QUE NÃO HÁ LISTA DE EMPRESAS
// Seria mais simples pedir para a pessoa escolher. Mas quantos clientes
// a temvia tem é dado comercial dela, não informação de tela de login —
// e com cem transportadoras a escolha manual deixa de funcionar.
// ============================================================

// Projeto central da temvia. Guarda só hash de identificador e o slug da
// transportadora: nenhum e-mail ou telefone legível, e listar a coleção
// é proibido pela regra.
const FB_CENTRAL = {
  apiKey: "AIzaSyDuEQ9ncWAfhj6Ej10hcwgN4JuInPC3yYc",
  authDomain: "temvia-central.firebaseapp.com",
  projectId: "temvia-central",
  storageBucket: "temvia-central.firebasestorage.app",
  messagingSenderId: "50315523226",
  appId: "1:50315523226:web:dfe7f915f71a7459989b23"
};

const LEMBRAR = 'temvia_transportadora';

function mostrarErro(txt) {
  const e = document.getElementById('erro');
  e.innerHTML = txt;
  e.style.display = 'block';
}

function ocupado(sim) {
  document.getElementById('btn').disabled = sim;
  document.getElementById('carregando').style.display = sim ? 'block' : 'none';
  if (sim) document.getElementById('erro').style.display = 'none';
}

function irPara(t, ident) {
  try { localStorage.setItem(LEMBRAR, t); } catch (e) {}
  // O identificador vai junto para a pessoa não digitar duas vezes. Vai
  // na URL, que é o único caminho entre duas páginas — por isso só o
  // identificador, nunca a senha.
  const q = ident ? ('?ident=' + encodeURIComponent(ident)) : '';
  location.href = '/' + t + '/' + q;
}

async function entrar() {
  const ident = (document.getElementById('ident').value || '').trim();
  if (!ident) { mostrarErro('Informe seu e-mail ou telefone.'); return; }

  ocupado(true);
  try {
    // O motor do roteamento mora no comum.js: a mesma função que consulta
    // aqui é a que registra do outro lado. Duas implementações do mesmo
    // hash divergiriam no primeiro ajuste.
    const t = await window.temviaComum.roteamentoDe(ident, FB_CENTRAL);
    if (t) { irPara(t, ident); return; }

    mostrarErro('Não encontramos esse contato.<br><br>' +
      'Confira se digitou certo. Se for seu primeiro acesso, ' +
      'peça ao responsável pelo transporte na sua empresa para cadastrá-lo.');
  } catch (e) {
    mostrarErro('Não foi possível verificar agora. ' +
      'Confira sua conexão e tente de novo.');
  } finally {
    ocupado(false);
  }
}

document.getElementById('ident').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') { ev.preventDefault(); entrar(); }
});

// Quem já entrou neste aparelho vai direto, sem digitar. Só vale como
// atalho: se a pessoa mudou de empresa, basta voltar aqui e informar o
// contato de novo — o roteamento manda.
(function () {
  try {
    const t = localStorage.getItem(LEMBRAR);
    if (t && /^[a-z0-9_-]{2,40}$/.test(t) && !location.search) {
      location.replace('/' + t + '/');
    }
  } catch (e) {}
})();
</script>
<script src="/motor/comum.js?v=2026-09-11-A"></script>
</body>
</html>
